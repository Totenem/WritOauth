[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
exclude = ["database/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test fixtures hold multi-sentence prose samples. Hard-wrapping them would
# make the writing-style differences they exist to demonstrate unreadable.
"tests/test_ai/conftest.py" = ["E501"]
"tests/conftest.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["database/migrations"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
