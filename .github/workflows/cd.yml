name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase repository paths, but github.repository preserves
      # the original casing (e.g. Totenem/WritOauth). Lowercase it once here.
      - name: Compute lowercase image repo
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/backend:latest
            ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
          # Reuse the layer + pip caches produced by CI builds.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
            ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

# Deployment itself is NOT done here. The backend (Render) and frontend
# (Vercel) both auto-deploy on push via their own native GitHub integration,
# configured once in each provider's dashboard - see
# docs/development/deployment.md. The GHCR images built above are kept for
# provenance/traceability, not because either provider pulls from GHCR.
