# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend as a free Docker web service. Render auto-deploys
# on every push to the connected branch via its native GitHub integration -
# no CI/CD workflow step is involved (see .github/workflows/cd.yml).
#
# One-time manual setup in the Render dashboard: create a new Blueprint from
# this repo, then fill in the `sync: false` env vars below (DATABASE_URL,
# JWT_SECRET_KEY, CORS_ORIGINS) - see docs/development/deployment.md.
services:
  - type: web
    name: writoauth-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: ANALYSIS_FLAG_THRESHOLD
        value: "75.0"
